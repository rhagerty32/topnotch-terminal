name: Release

# Publishing a GitHub Release runs this job and attaches the disk image.
# The image uses Resources/dmg/background.png: drag the app up into the notch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the disk image to, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: topnotch-terminal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the disk image
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          export MARKETING_VERSION="$version"
          bash scripts/package-dmg.sh

      - name: Upload the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg="dist/TopNotchTerminal-${version}.dmg"
          test -f "$dmg"
          gh release upload "$TAG" "$dmg" --clobber
